ambiguous_headers:
  jumlah:
    quantity_field: quantity
    amount_field: line_total
    rate_fields: [base_rate, base_rate_idr]
    amount_value_floor: "1000"
token_grid:
  header_max_rows: 2
pymupdf:
  # Strategies are tried in order; the first strategy that yields an ACCEPTED table wins (merge_strategies: false).
  strategies: [lines, text]
  merge_strategies: false
  # Reject page-wide tables (F7). Origin: on dev+val structural gold the largest table covers 0.298 of the page
  # (p90 0.22); 0.5 keeps >1.6x margin. Chosen on dev, confirmed on val (scripts/experiments/pymupdf_variants.py).
  max_page_area_ratio: 0.5
  min_data_rows: 1
  min_cols: 2
  max_header_chars: 0
geometry:
  # All distances are expressed relative to the text itself (em = median token height), so they hold for any DPI/page size.
  line_tolerance: 0.5          # tokens whose centres differ by <= this x median token height share a visual line
  segment_gap_em: 0.8          # horizontal gap above this many em starts a new cell-like segment
  block_gap_factor: 2.2        # vertical gap above this many median line heights separates two text blocks
  side_gutter_min: 0.05        # minimum empty vertical gutter (share of page width) to even consider a side-by-side split
  side_header_lines: 4         # a split also needs repeated header words on one of the first lines of the block ...
  side_header_repeats: 2       # ... at least this many distinct non-numeric texts on both sides of the gutter
  side_header_jaccard: 0.5     # ... and those shared texts must be this share of all distinct texts on that line (rejects splits inside one table)
  side_min_lines: 3            # both sides need at least this many lines
  default_aspect: 0.7071       # page width / height when the evidence does not carry the page size (A4 portrait)
