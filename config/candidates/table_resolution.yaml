ambiguous_headers:
  jumlah:
    quantity_field: quantity
    amount_field: line_total
    rate_fields: [base_rate, base_rate_idr]
    amount_value_floor: "1000"
token_grid:
  header_max_rows: 2
pymupdf:
  # Strategies are tried in order; the first strategy that yields an ACCEPTED table wins (merge_strategies: false).
  strategies: [lines, text]
  merge_strategies: false
  # Reject page-wide tables (F7). Origin: on dev+val structural gold the largest table covers 0.298 of the page
  # (p90 0.22); 0.5 keeps >1.6x margin. Chosen on dev, confirmed on val (scripts/experiments/pymupdf_variants.py).
  max_page_area_ratio: 0.5
  min_data_rows: 1
  min_cols: 2
  max_header_chars: 0
